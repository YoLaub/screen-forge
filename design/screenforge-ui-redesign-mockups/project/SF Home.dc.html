<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'Geist',-apple-system,sans-serif;font-size:12px">
  <div style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px"><span style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:50%;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:50%;background:#28c840"></span></div>
  <div style="flex:1;display:grid;place-items:center;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px">
    <div style="width:440px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px">
        <div style="width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#1fc8dc 0%,#4b5cf0 55%,#c23bd0 100%);position:relative;box-shadow:0 8px 24px rgba(75,92,240,.3)"><span style="position:absolute;right:10px;bottom:10px;width:19px;height:19px;border-right:4px solid #fff;border-bottom:4px solid #fff;border-radius:0 0 4px 0"></span><span style="position:absolute;left:10px;top:10px;width:11px;height:11px;border-radius:3px;background:#fff"></span></div>
        <div style="font:600 30px/1.1 'Geist',sans-serif;letter-spacing:-.02em">ScreenForge</div>
        <div style="color:var(--tx2);font-size:14px;line-height:1.5;text-wrap:pretty">Pick the project folder. The canvas is saved in its <span style="font:400 12.5px 'Geist Mono',monospace;color:var(--tx)">.screenforge/</span> folder.</div>
      </div>
      <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
        <button style="height:84px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 18px;cursor:pointer;text-align:left;color:var(--tx)" style-hover="border-color:var(--acc)">
          <span style="width:40px;height:40px;border-radius:10px;background:var(--acc);color:var(--accTx);display:grid;place-items:center;flex:none"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5c0-.6.4-1 1-1h3.2l1.5 1.6H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"></path></svg></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:600 14px 'Geist',sans-serif">Open a folder</span><span style="color:var(--tx3)">or drop one here</span></span>
          <span style="font:500 11px 'Geist Mono',monospace;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;color:var(--tx3)">⌘O</span>
        </button>
      </sc-if>
      <sc-if value="{{ opening }}" hint-placeholder-val="{{ false }}">
        <div style="height:84px;border:1.5px solid var(--acc);border-radius:12px;background:var(--accSoft);display:flex;align-items:center;gap:14px;padding:0 18px">
          <span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);box-sizing:border-box;flex:none"></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font:600 14px 'Geist',sans-serif">Opening acme-dashboard…</span><span style="color:var(--tx2)">Loading 8 elements from .screenforge/</span></span>
        </div>
      </sc-if>
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:11px;font-weight:600;color:var(--tx3);padding:0 10px 6px">Recent</div>
        <sc-for list="{{ recent }}" as="r" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;cursor:pointer" style-hover="background:var(--hover)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--tx3);flex:none"><path d="M2 4.5c0-.6.4-1 1-1h3.2l1.5 1.6H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"></path></svg>
            <span style="font-weight:500">{{ r.name }}</span><span style="flex:1;min-width:0;font:400 11px 'Geist Mono',monospace;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.path }}</span><span style="color:var(--tx3);font-size:11px">{{ r.when }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:700},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;opening&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state || 'idle';
    return {
      idle: st === 'idle', opening: st === 'opening',
      recent: [
        { name: 'acme-dashboard', path: '~/dev/acme-dashboard', when: 'Today' },
        { name: 'billing-api', path: '~/dev/work/billing-api', when: 'Yesterday' },
        { name: 'portfolio', path: '~/sites/portfolio', when: '12 Sep' },
      ],
    };
  }
}
</script>
</body>
</html>
