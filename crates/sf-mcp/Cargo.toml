[package]
name = "sf-mcp"
version = "0.1.0"
edition = "2024"
description = "screenforge-mcp: read-only MCP server (stdio) over a project's .screenforge/ folder"

[[bin]]
name = "screenforge-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
rmcp = { version = "3.4.1", features = ["transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sf-core = { path = "../sf-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
